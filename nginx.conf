server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API, Swagger и OAuth2 уходят на Spring Boot
    location ~ ^/(api|oauth2|login/oauth2|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # $http_host сохраняет внешний порт (3000) — по нему Spring строит redirect_uri для Google
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Клиентский роутинг React: любые неизвестные пути отдают index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
